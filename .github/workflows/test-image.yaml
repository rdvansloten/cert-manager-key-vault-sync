name: Test Docker Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'app/**'
      - 'Dockerfile'

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.10.19

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        platforms: linux/amd64,linux/arm64

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        platforms: linux/amd64,linux/arm64
        context: .
        push: false
        tags: ${{ github.repository }}:gh-run-${{ github.run_id }}

    - name: Load amd64 image for scanning
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        platforms: linux/amd64
        context: .
        load: true
        tags: cve-scan:${{ github.run_id }}

    - name: Scan image for CVEs
      id: scan
      run: |
        bash .github/scripts/cve-report.sh cve-scan:${{ github.run_id }} cve-report.md
        cat cve-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment scan results on the PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- cve-report -->")) | .id' | head -n 1)"
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@cve-report.md >/dev/null
        else
          gh pr comment "$PR" --body-file cve-report.md
        fi

    - name: Fail on fixable HIGH or CRITICAL CVEs
      if: steps.scan.outputs.fixable != '0'
      run: |
        echo "::error::${{ steps.scan.outputs.fixable }} HIGH/CRITICAL CVEs have a fix available"
        exit 1
