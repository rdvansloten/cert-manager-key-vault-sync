name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'app/**'
      - 'Dockerfile'

env:
  IMAGE_NAME: cert-manager-key-vault-sync
  CHART_NAME: cert-manager-key-vault-sync-chart
  REPOSITORY_NAME: rdvansloten

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.10.19
        cache: false

    - name: Read version from YAML
      id: read_version
      run: |
        version=$(cat ./charts/${{ env.CHART_NAME }}/Chart.yaml | grep appVersion | awk '{print $2}')
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        platforms: linux/amd64,linux/arm64

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        platforms: linux/amd64,linux/arm64
        context: .
        push: true
        tags: ${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:latest, ${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$APP_VERSION" >/dev/null 2>&1; then
          echo "Release $APP_VERSION already exists."
          exit 0
        fi
        bash .github/scripts/release-notes.sh "$APP_VERSION" > release-notes.md
        gh release create "$APP_VERSION" --target "$GITHUB_SHA" --title "$APP_VERSION" --notes-file release-notes.md --latest

    - name: Logout from Docker Hub
      run: docker logout